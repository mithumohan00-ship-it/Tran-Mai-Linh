    <!-- Letter n -->
    <path d="M174,47 L175,62 M175,52 C178,45 190,44 190,52 L190,62" stroke-width="2.4"/>
    <!-- Letter h with tall loop -->
    <path d="M198,54 C196,36 202,18 206,18 C209,18 206,42 204,62 M204,50 C208,44 220,44 220,52 L220,62" stroke-width="2.5"/>

