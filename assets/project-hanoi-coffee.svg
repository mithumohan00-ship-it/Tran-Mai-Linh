<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCoffee" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F1E6"/>
      <stop offset="100%" stop-color="#EADBCE"/>
    </linearGradient>
    <filter id="cShdw" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#3D291C" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="800" height="500" rx="24" fill="url(#bgCoffee)"/>

  <!-- Coffee plant leaves watermark -->
  <g fill="#2E3B32" opacity="0.15">
    <path d="M60,160 Q120,100 190,130 Q140,180 60,160 Z"/>
    <path d="M60,200 Q130,190 170,250 Q100,260 60,200 Z"/>
    <circle cx="130" cy="180" r="8" fill="#874127"/>
    <circle cx="145" cy="190" r="7" fill="#874127"/>
  </g>

  <!-- Kraft Coffee Pouch Mockup (Center Left) -->
  <g transform="translate(140, 90)" filter="url(#cShdw)">
    <!-- Bag Main Body -->
    <polygon points="20,40 210,40 230,340 0,340" fill="#D2B48C"/>
    <!-- Fold top seal -->
    <rect x="15" y="24" width="200" height="20" rx="4" fill="#BFA075"/>
    <line x1="20" y1="34" x2="210" y2="34" stroke="#8F7249" stroke-width="2" stroke-dasharray="3,3"/>
    
    <!-- Aroma degassing valve -->
    <circle cx="115" cy="80" r="9" fill="#B09066"/>
    <circle cx="115" cy="80" r="5" fill="#85643B"/>

    <!-- Premium Printed Label Sticker -->
    <g transform="translate(35, 110)">
      <rect width="160" height="190" rx="8" fill="#FFFDF8" stroke="#874127" stroke-width="1.5"/>
      
      <!-- Vintage Hanoi Roastery Crest -->
      <circle cx="80" cy="42" r="28" fill="#874127"/>
      <circle cx="80" cy="42" r="25" fill="none" stroke="#D9A454" stroke-width="1"/>
      <path d="M72,40 C75,32 85,32 88,40 C85,48 75,48 72,40 Z" fill="#D9A454"/>
      
      <text x="80" y="86" font-family="'Fraunces', serif" font-weight="700" font-size="14" fill="#3D291C" text-anchor="middle">SÔNG HỒNG</text>
      <text x="80" y="98" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#874127" text-anchor="middle" letter-spacing="2">SPECIALTY ROASTERS</text>
      
      <!-- Line separator -->
      <line x1="25" y1="108" x2="135" y2="108" stroke="#D9A454" stroke-width="1"/>

      <!-- Roast details -->
      <text x="30" y="124" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="9" fill="#3D291C">Xuất xứ:</text>
      <text x="70" y="124" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#666">Cầu Đất, Đà Lạt</text>

      <text x="30" y="140" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="9" fill="#3D291C">Hương vị:</text>
      <text x="75" y="140" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#666">Mật ong, Cacao &amp; Cam</text>

      <text x="30" y="156" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="9" fill="#3D291C">Mức rang:</text>
      <text x="80" y="156" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#874127">Rang vừa • Gói 250g</text>

      <!-- Stamp -->
      <rect x="25" y="166" width="110" height="15" rx="3" fill="#F4EDE2"/>
      <text x="80" y="177" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="8" fill="#874127" text-anchor="middle">RANG TẠI HÀ NỘI</text>
    </g>
  </g>

  <!-- Artisanal Ceramic Mug with Saucer (Center) -->
  <g transform="translate(370, 240)" filter="url(#cShdw)">
    <!-- Saucer -->
    <ellipse cx="60" cy="110" rx="70" ry="20" fill="#E2D1C1" stroke="#C2AC99" stroke-width="2"/>
    <!-- Mug Body -->
    <rect x="20" y="30" width="80" height="75" rx="10" fill="#874127"/>
    <!-- Mug Rim & Rich Coffee with Latte Art -->
    <ellipse cx="60" cy="30" rx="40" ry="12" fill="#5A2818"/>
    <!-- Latte Art Heart -->
    <path d="M60,34 C54,26 46,27 46,31 C46,35 60,40 60,40 C60,40 74,35 74,31 C74,27 66,26 60,34 Z" fill="#F7F1E6"/>
    <!-- Mug Handle -->
    <path d="M100,45 C120,45 120,80 100,80" stroke="#874127" stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Mobile Order Web App Screen (Right) -->
  <g transform="translate(500, 45) rotate(4)" filter="url(#cShdw)">
    <rect x="0" y="0" width="220" height="420" rx="30" fill="#1C1B19" stroke="#3A3835" stroke-width="2"/>
    <rect x="6" y="6" width="208" height="408" rx="26" fill="#FFFDF9"/>
    
    <!-- Notch -->
    <rect x="75" y="12" width="60" height="14" rx="7" fill="#1C1B19"/>

    <!-- Mobile Header -->
    <text x="20" y="55" font-family="'Fraunces', serif" font-weight="700" font-size="14" fill="#3D291C">Sông Hồng Đặt Món</text>
    <text x="20" y="68" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#874127">Phan Chu Trinh, Hoàn Kiếm, HN</text>

    <!-- Interactive Menu Item Card -->
    <g transform="translate(14, 85)">
      <rect width="180" height="75" rx="10" fill="#F9F5EE"/>
      <circle cx="36" cy="38" r="22" fill="#EADBCE"/>
      <circle cx="36" cy="38" r="14" fill="#874127"/>
      <text x="68" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10" fill="#3D291C">Cà Phê Trứng Hà Nội</text>
      <text x="68" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#777">Kem trứng béo ngậy &amp; robusta</text>
      <text x="68" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="9" fill="#874127">45,000 VND</text>
      <!-- Add Button -->
      <circle cx="160" cy="52" r="10" fill="#874127"/>
      <text x="160" y="56" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" fill="#FFF" text-anchor="middle">+</text>
    </g>

    <!-- Second Menu Item -->
    <g transform="translate(14, 170)">
      <rect width="180" height="75" rx="10" fill="#F9F5EE"/>
      <circle cx="36" cy="38" r="22" fill="#EADBCE"/>
      <circle cx="36" cy="38" r="14" fill="#D9A454"/>
      <text x="68" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10" fill="#3D291C">Phin Dừa Đậm Vị</text>
      <text x="68" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#777">Cốt dừa nướng thơm lừng</text>
      <text x="68" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="9" fill="#874127">52,000 VND</text>
      <!-- Add Button -->
      <circle cx="160" cy="52" r="10" fill="#874127"/>
      <text x="160" y="56" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" fill="#FFF" text-anchor="middle">+</text>
    </g>

    <!-- Pick up timer notification -->
    <g transform="translate(14, 260)">
      <rect width="180" height="75" rx="12" fill="#3D291C"/>
      <text x="16" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10" fill="#D9A454">Sẵn sàng trong 4 phút</text>
      <text x="16" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#CCC">Đơn #SH-402 • Barista Tuấn đang pha</text>
      <!-- Progress Bar -->
      <rect x="16" y="52" width="148" height="6" rx="3" fill="#5A3A25"/>
      <rect x="16" y="52" width="115" height="6" rx="3" fill="#D9A454"/>
    </g>
  </g>

  <!-- Tag Pill Overlay -->
  <g transform="translate(40, 40)">
    <rect width="215" height="34" rx="17" fill="#1F1F1F"/>
    <circle cx="20" cy="17" r="5" fill="#D9A454"/>
    <text x="36" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="12" fill="#FAF8F6">Thương hiệu &amp; Ứng dụng Web</text>
  </g>
</svg>
