<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAnAn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F1E8"/>
      <stop offset="100%" stop-color="#EFE6DA"/>
    </linearGradient>
    <filter id="cardShdw" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#4A3423" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="800" height="500" rx="24" fill="url(#bgAnAn)"/>

  <!-- Decorative background shapes -->
  <circle cx="120" cy="100" r="160" fill="#E8D8C3" opacity="0.4"/>
  <circle cx="700" cy="400" r="180" fill="#D7E0D3" opacity="0.4"/>

  <!-- Botanical branch watermark -->
  <g stroke="#6B7F5E" stroke-width="2" fill="none" opacity="0.25">
    <path d="M50,450 Q120,380 200,350 Q280,320 320,200"/>
    <ellipse cx="140" cy="380" rx="14" ry="7" transform="rotate(-30 140 380)" fill="#6B7F5E"/>
    <ellipse cx="210" cy="340" rx="14" ry="7" transform="rotate(20 210 340)" fill="#6B7F5E"/>
    <ellipse cx="270" cy="290" rx="14" ry="7" transform="rotate(-40 270 290)" fill="#6B7F5E"/>
  </g>

  <!-- Central Composition: Brand Elements & Packaging Mockup -->
  
  <!-- Kraft Paper Tote / Bag Mockup -->
  <g transform="translate(130, 110)" filter="url(#cardShdw)">
    <polygon points="40,90 220,90 240,320 20,320" fill="#D8BE9B"/>
    <polygon points="40,90 70,70 250,70 220,90" fill="#C9AD87"/>
    <polygon points="220,90 250,70 270,300 240,320" fill="#BFA27C"/>
    <!-- Bag Handle -->
    <path d="M90,80 C90,20 170,20 170,80" stroke="#846645" stroke-width="8" fill="none" stroke-linecap="round"/>
    
    <!-- Crest Badge on Bag -->
    <circle cx="130" cy="190" r="50" fill="#FAF6F0"/>
    <circle cx="130" cy="190" r="44" fill="none" stroke="#C85A32" stroke-width="2"/>
    <!-- Paw & Leaf Icon -->
    <g transform="translate(130, 185) scale(0.9)">
      <!-- Paw main pad shaped like a heart/leaf -->
      <path d="M0,12 C-14,0 -20,-12 0,-22 C20,-12 14,0 0,12 Z" fill="#6B7F5E"/>
      <circle cx="-16" cy="-24" r="6" fill="#C85A32"/>
      <circle cx="0" cy="-32" r="6" fill="#C85A32"/>
      <circle cx="16" cy="-24" r="6" fill="#C85A32"/>
    </g>
    <text x="130" y="222" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#2C3529" text-anchor="middle" letter-spacing="2">AN AN VET</text>
    <text x="130" y="234" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#6B7F5E" text-anchor="middle" letter-spacing="1">HOLISTIC CARE</text>
  </g>

  <!-- Veterinary Amber Glass Dropper Bottle / Tin -->
  <g transform="translate(370, 160)" filter="url(#cardShdw)">
    <!-- Bottle Body -->
    <rect x="20" y="80" width="80" height="150" rx="12" fill="#784B29"/>
    <!-- Label -->
    <rect x="20" y="110" width="80" height="90" fill="#FDFBF7"/>
    <rect x="25" y="115" width="70" height="80" fill="none" stroke="#6B7F5E" stroke-width="1"/>
    <text x="60" y="135" font-family="'Fraunces', serif" font-weight="700" font-size="12" fill="#C85A32" text-anchor="middle">Calm Pet</text>
    <text x="60" y="150" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#4B5645" text-anchor="middle">HERBAL TONIC</text>
    <line x1="35" y1="158" x2="85" y2="158" stroke="#DDA74F" stroke-width="1"/>
    <text x="60" y="172" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" fill="#888" text-anchor="middle">HANOI • 50ML</text>
    <!-- Cap & Dropper Pipette -->
    <rect x="35" y="55" width="50" height="25" rx="3" fill="#222"/>
    <path d="M45,55 C45,35 75,35 75,55 Z" fill="#3B3835"/>
  </g>

  <!-- Modern Adoption Passport & Appointment Card -->
  <g transform="translate(480, 130) rotate(6)" filter="url(#cardShdw)">
    <rect x="0" y="0" width="200" height="260" rx="14" fill="#FFFFFF"/>
    <!-- Card Cover Header -->
    <rect x="0" y="0" width="200" height="90" rx="14" fill="#6B7F5E"/>
    <rect x="0" y="76" width="200" height="14" fill="#6B7F5E"/>
    <!-- Hand drawn cat & dog sketch silhouette -->
    <circle cx="100" cy="45" r="28" fill="#FDFBF7"/>
    <text x="100" y="50" font-family="'Caveat', cursive" font-weight="700" font-size="20" fill="#C85A32" text-anchor="middle">An An</text>
    <!-- Text lines -->
    <text x="24" y="120" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14" fill="#1F1F1F">Pet Health Passport</text>
    <text x="24" y="136" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#666">Name: Bún Chả (Rescue Pup)</text>
    <text x="24" y="150" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#666">Breed: Vietnamese Mixed</text>
    <text x="24" y="164" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#666">Vaccination: Complete ✓</text>
    <!-- Stamp -->
    <g transform="translate(135, 190) rotate(-15)">
      <rect x="0" y="0" width="48" height="48" rx="6" fill="none" stroke="#C85A32" stroke-width="2"/>
      <text x="24" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="8" fill="#C85A32" text-anchor="middle">APPROVED</text>
      <text x="24" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" fill="#C85A32" text-anchor="middle">HEALTHY</text>
    </g>
  </g>

  <!-- Tag Pill Overlay -->
  <g transform="translate(40, 40)">
    <rect width="210" height="34" rx="17" fill="#1F1F1F"/>
    <circle cx="20" cy="17" r="5" fill="#C85A32"/>
    <text x="36" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="12" fill="#FAF8F6">Nhận diện Thương hiệu</text>
  </g>
</svg>
