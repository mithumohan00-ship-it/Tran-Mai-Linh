<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCinema" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18191E"/>
      <stop offset="100%" stop-color="#0E0F12"/>
    </linearGradient>
    <linearGradient id="screenCurveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DDA74F" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#DDA74F" stop-opacity="0"/>
    </linearGradient>
    <filter id="phoneShdw" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="800" height="500" rx="24" fill="url(#bgCinema)"/>

  <!-- Ambient light glow from top -->
  <ellipse cx="400" cy="50" rx="300" ry="120" fill="#DDA74F" opacity="0.08"/>

  <!-- Phone 1: Movie Discovery & Details Screen (Left) -->
  <g transform="translate(130, 45)" filter="url(#phoneShdw)">
    <!-- Phone Bezel -->
    <rect x="0" y="0" width="240" height="420" rx="34" fill="#25272F" stroke="#3A3E4B" stroke-width="2"/>
    <rect x="8" y="8" width="224" height="404" rx="28" fill="#121316"/>
    
    <!-- Notch / Island -->
    <rect x="85" y="16" width="70" height="18" rx="9" fill="#000"/>
    
    <!-- Hero Movie Card -->
    <rect x="18" y="48" width="204" height="150" rx="16" fill="#2A1B14"/>
    <!-- Stylized Poster Art: Sunset in Hanoi / Indie Film -->
    <path d="M18,130 Q120,80 222,130 L222,198 L18,198 Z" fill="#C85A32"/>
    <circle cx="120" cy="110" r="32" fill="#DDA74F"/>
    <text x="32" y="176" font-family="'Fraunces', serif" font-weight="700" font-size="15" fill="#FFF">Mùa Ổi Chín</text>
    <text x="32" y="190" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#E8D5C4">Đặng Nhật Minh • 4K Remaster</text>

    <!-- Screening Info -->
    <text x="20" y="222" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#FFF">Lịch Chiếu Hôm Nay</text>
    
    <!-- Time Pills -->
    <g transform="translate(20, 234)">
      <rect width="48" height="26" rx="8" fill="#DDA74F"/>
      <text x="24" y="17" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10" fill="#121316" text-anchor="middle">18:30</text>
    </g>
    <g transform="translate(74, 234)">
      <rect width="48" height="26" rx="8" fill="#22242B" stroke="#383B46" stroke-width="1"/>
      <text x="24" y="17" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="10" fill="#AAA" text-anchor="middle">20:45</text>
    </g>
    <g transform="translate(128, 234)">
      <rect width="48" height="26" rx="8" fill="#22242B" stroke="#383B46" stroke-width="1"/>
      <text x="24" y="17" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="10" fill="#AAA" text-anchor="middle">22:15</text>
    </g>

    <!-- Director Spotlight Mini Card -->
    <rect x="20" y="278" width="200" height="74" rx="12" fill="#1B1C22"/>
    <circle cx="50" cy="315" r="20" fill="#3D322A"/>
    <text x="80" y="308" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#FFF">Ghi Chú Đạo Diễn</text>
    <text x="80" y="324" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#999">Giao lưu cùng đoàn phim</text>
    <text x="80" y="338" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#DDA74F">★ Bản chiếu Phim nhựa 35mm</text>

    <!-- Bottom Nav Bar -->
    <rect x="8" y="366" width="224" height="46" rx="20" fill="#17181F"/>
    <circle cx="50" cy="388" r="4" fill="#DDA74F"/>
    <circle cx="120" cy="388" r="4" fill="#555"/>
    <circle cx="190" cy="388" r="4" fill="#555"/>
  </g>

  <!-- Phone 2: Interactive Acoustic Seating & Reservation Screen (Right) -->
  <g transform="translate(420, 20)" filter="url(#phoneShdw)">
    <!-- Phone Bezel -->
    <rect x="0" y="0" width="250" height="440" rx="36" fill="#25272F" stroke="#3A3E4B" stroke-width="2"/>
    <rect x="8" y="8" width="234" height="424" rx="30" fill="#121316"/>
    
    <!-- Notch -->
    <rect x="90" y="16" width="70" height="18" rx="9" fill="#000"/>

    <text x="24" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" fill="#FFF">Chọn Ghế Ngồi</text>
    <text x="24" y="76" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#888">Phòng chiếu 02 • Âm thanh Dolby Atmos</text>

    <!-- Curved Screen Graphic -->
    <path d="M35,115 Q125,95 215,115" stroke="#DDA74F" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M35,115 Q125,95 215,115 L215,135 Q125,115 35,135 Z" fill="url(#screenCurveGrad)"/>
    <text x="125" y="110" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" fill="#DDA74F" text-anchor="middle" letter-spacing="3">MÀN HÌNH CHIẾU</text>

    <!-- Seating Grid -->
    <g transform="translate(45, 145)">
      <!-- Row A -->
      <circle cx="15" cy="15" r="7" fill="#2C2F3A"/>
      <circle cx="35" cy="15" r="7" fill="#2C2F3A"/>
      <circle cx="65" cy="15" r="7" fill="#2C2F3A"/>
      <circle cx="85" cy="15" r="7" fill="#2C2F3A"/>
      <circle cx="115" cy="15" r="7" fill="#2C2F3A"/>
      <circle cx="135" cy="15" r="7" fill="#2C2F3A"/>

      <!-- Row B (Some booked) -->
      <circle cx="15" cy="35" r="7" fill="#2C2F3A"/>
      <circle cx="35" cy="35" r="7" fill="#4B5061"/>
      <circle cx="65" cy="35" r="7" fill="#4B5061"/>
      <circle cx="85" cy="35" r="7" fill="#4B5061"/>
      <circle cx="115" cy="35" r="7" fill="#2C2F3A"/>
      <circle cx="135" cy="35" r="7" fill="#2C2F3A"/>

      <!-- Row C (Selected Seats in Amber) -->
      <circle cx="15" cy="55" r="7" fill="#2C2F3A"/>
      <circle cx="35" cy="55" r="7" fill="#2C2F3A"/>
      <circle cx="65" cy="55" r="8" fill="#DDA74F" stroke="#FFF" stroke-width="2"/>
      <circle cx="85" cy="55" r="8" fill="#DDA74F" stroke="#FFF" stroke-width="2"/>
      <circle cx="115" cy="55" r="7" fill="#2C2F3A"/>
      <circle cx="135" cy="55" r="7" fill="#2C2F3A"/>

      <!-- Row D -->
      <circle cx="15" cy="75" r="7" fill="#2C2F3A"/>
      <circle cx="35" cy="75" r="7" fill="#2C2F3A"/>
      <circle cx="65" cy="75" r="7" fill="#2C2F3A"/>
      <circle cx="85" cy="75" r="7" fill="#2C2F3A"/>
      <circle cx="115" cy="75" r="7" fill="#2C2F3A"/>
      <circle cx="135" cy="75" r="7" fill="#2C2F3A"/>
    </g>

    <!-- Legend -->
    <g transform="translate(45, 248)" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#888">
      <circle cx="10" cy="5" r="5" fill="#2C2F3A"/>
      <text x="20" y="8">Trống</text>
      <circle cx="60" cy="5" r="5" fill="#4B5061"/>
      <text x="70" y="8">Đã đặt</text>
      <circle cx="110" cy="5" r="5" fill="#DDA74F"/>
      <text x="120" y="8">Đang chọn</text>
    </g>

    <!-- Checkout Bar Card -->
    <g transform="translate(18, 275)">
      <rect width="214" height="135" rx="18" fill="#1B1C22" stroke="#2D303C" stroke-width="1"/>
      <text x="16" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#FFF">Ghế: C03, C04 (VIP)</text>
      <text x="16" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#888">Tổng cộng: 220,000 VND</text>
      
      <!-- CTA Button -->
      <rect x="14" y="60" width="186" height="42" rx="12" fill="#DDA74F"/>
      <text x="107" y="86" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#121316" text-anchor="middle">Tiếp tục đặt vé →</text>
    </g>
  </g>

  <!-- Tag Pill Overlay -->
  <g transform="translate(40, 40)">
    <rect width="190" height="34" rx="17" fill="#25272F" stroke="#3D4252" stroke-width="1"/>
    <circle cx="20" cy="17" r="5" fill="#DDA74F"/>
    <text x="36" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="12" fill="#FAF8F6">Ứng dụng Di động UI/UX</text>
  </g>
</svg>
