<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgStudio" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF7F0"/>
      <stop offset="100%" stop-color="#F0E5D4"/>
    </linearGradient>
    <filter id="artShdw" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#4E3B2B" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="800" height="500" rx="24" fill="url(#bgStudio)"/>

  <!-- Creative paint splashes in background -->
  <path d="M120,80 C180,60 220,120 190,160 C160,200 90,170 100,120 Z" fill="#E8B58D" opacity="0.3"/>
  <path d="M680,340 C740,310 790,360 760,420 C720,470 650,440 660,380 Z" fill="#9FB594" opacity="0.3"/>

  <!-- Studio Easel (Center Left) -->
  <g transform="translate(180, 50)" filter="url(#artShdw)">
    <!-- Wooden Easel Legs -->
    <line x1="80" y1="40" x2="20" y2="420" stroke="#875B35" stroke-width="12" stroke-linecap="round"/>
    <line x1="160" y1="40" x2="220" y2="420" stroke="#875B35" stroke-width="12" stroke-linecap="round"/>
    <line x1="120" y1="20" x2="120" y2="410" stroke="#754C28" stroke-width="10" stroke-linecap="round"/>

    <!-- Canvas Shelf Bar -->
    <rect x="0" y="270" width="240" height="20" rx="6" fill="#66401E"/>
    <rect x="90" y="250" width="60" height="15" rx="4" fill="#96663E"/>

    <!-- Stretched Canvas with Student Artwork: Hanoi Old Quarter & Lotus -->
    <g transform="translate(15, 60)">
      <!-- Canvas Board -->
      <rect x="0" y="0" width="210" height="210" rx="8" fill="#FFFDF8" stroke="#D5C5B2" stroke-width="2"/>
      
      <!-- Student Artwork: Warm Gouache painting of Hanoi rooftop & Yellow French Colonial facade -->
      <g clip-path="url(#canvasClip)">
        <clipPath id="canvasClip">
          <rect x="0" y="0" width="210" height="210" rx="8"/>
        </clipPath>
        <!-- Sunset sky -->
        <rect x="0" y="0" width="210" height="100" fill="#F4BA7C"/>
        <!-- Sun circle -->
        <circle cx="160" cy="50" r="26" fill="#E26D5C"/>
        
        <!-- Distant roofs -->
        <polygon points="10,120 50,80 90,120" fill="#A84C32"/>
        <polygon points="85,125 140,75 190,125" fill="#B8583B"/>
        
        <!-- Hanoi French-colonial yellow wall -->
        <rect x="25" y="110" width="160" height="100" fill="#E9C168"/>
        <!-- Green French shutter window -->
        <rect x="50" y="130" width="34" height="46" rx="4" fill="#3D5A45"/>
        <rect x="95" y="130" width="34" height="46" rx="4" fill="#3D5A45"/>
        <line x1="67" y1="130" x2="67" y2="176" stroke="#2B4031" stroke-width="2"/>
        <line x1="112" y1="130" x2="112" y2="176" stroke="#2B4031" stroke-width="2"/>

        <!-- Balcony railing & bougainvillea vines -->
        <rect x="40" y="170" width="100" height="12" fill="#2E2825"/>
        <path d="M40,165 Q80,150 140,168" stroke="#C84168" stroke-width="8" stroke-linecap="round" fill="none"/>
        <circle cx="55" cy="162" r="4" fill="#EA638C"/>
        <circle cx="95" cy="158" r="4" fill="#EA638C"/>
        <circle cx="125" cy="164" r="4" fill="#EA638C"/>
      </g>

      <!-- Student Label Tag at bottom corner of canvas -->
      <g transform="translate(110, 182)">
        <rect width="90" height="20" rx="4" fill="#1F1F1F" opacity="0.85"/>
        <text x="45" y="14" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#FFF" text-anchor="middle">Mai Anh (Age 14) • 2024</text>
      </g>
    </g>
  </g>

  <!-- Wooden Artist Palette with colorful pigment daubs (Bottom Left) -->
  <g transform="translate(70, 310) rotate(-15)" filter="url(#artShdw)">
    <!-- Palette body with thumb hole -->
    <path d="M20,70 C20,25 70,0 130,0 C190,0 230,35 230,85 C230,120 190,135 170,140 C150,145 150,165 165,180 C180,195 170,215 140,215 C80,215 20,160 20,70 Z" fill="#DDBB96" stroke="#B8946E" stroke-width="2"/>
    <!-- Thumb hole -->
    <ellipse cx="140" cy="175" rx="14" ry="20" fill="#F0E5D4" stroke="#B8946E" stroke-width="2"/>
    
    <!-- Paint dollops / puddles -->
    <circle cx="55" cy="45" r="13" fill="#C85A32"/>
    <circle cx="90" cy="30" r="14" fill="#DDA74F"/>
    <circle cx="130" cy="32" r="13" fill="#6B7F5E"/>
    <circle cx="170" cy="50" r="13" fill="#3B5A7A"/>
    <circle cx="198" cy="85" r="12" fill="#874127"/>
    <circle cx="85" cy="120" r="11" fill="#F4E8DF"/>
  </g>

  <!-- Lesson Framework & Curriculum Guidebook (Right Side) -->
  <g transform="translate(470, 80) rotate(3)" filter="url(#artShdw)">
    <!-- Binder Cover -->
    <rect x="0" y="0" width="240" height="320" rx="14" fill="#FFFFFF" stroke="#E2D6C5" stroke-width="2"/>
    
    <!-- Spine binding tape -->
    <rect x="0" y="0" width="22" height="320" rx="10" fill="#C85A32"/>
    <line x1="11" y1="40" x2="11" y2="280" stroke="#FFF" stroke-width="2" stroke-dasharray="8,8"/>

    <!-- Notebook Header -->
    <g transform="translate(42, 30)">
      <text x="0" y="16" font-family="'Fraunces', serif" font-weight="700" font-size="15" fill="#2A2421">Khung Giáo Trình</text>
      <text x="0" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#755E4E" letter-spacing="1">HỌC CÁCH "NHÌN VÀ VẼ"</text>
      <line x1="0" y1="42" x2="175" y2="42" stroke="#C85A32" stroke-width="2"/>
    </g>

    <!-- 4-Stage Modules list -->
    <g transform="translate(42, 95)" font-family="'Plus Jakarta Sans', sans-serif">
      <!-- Step 1 -->
      <circle cx="10" cy="10" r="10" fill="#F7ECE4"/>
      <text x="10" y="14" font-weight="800" font-size="10" fill="#C85A32" text-anchor="middle">1</text>
      <text x="28" y="10" font-weight="700" font-size="11" fill="#2A2421">Quan Sát Hình Thể</text>
      <text x="28" y="22" font-size="9" fill="#888">Ánh sáng &amp; mảng tối thực tại</text>

      <!-- Step 2 -->
      <g transform="translate(0, 42)">
        <circle cx="10" cy="10" r="10" fill="#FDF3E3"/>
        <text x="10" y="14" font-weight="800" font-size="10" fill="#DDA74F" text-anchor="middle">2</text>
        <text x="28" y="10" font-weight="700" font-size="11" fill="#2A2421">Giai Điệu Hòa Sắc</text>
        <text x="28" y="22" font-size="9" fill="#888">Nhiệt độ màu &amp; không khí tranh</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 84)">
        <circle cx="10" cy="10" r="10" fill="#EFF4ED"/>
        <text x="10" y="14" font-weight="800" font-size="10" fill="#6B7F5E" text-anchor="middle">3</text>
        <text x="28" y="10" font-weight="700" font-size="11" fill="#2A2421">Kể Chuyện Bằng Cọ</text>
        <text x="28" y="22" font-size="9" fill="#888">Cất lên tiếng nói nội tâm</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(0, 126)">
        <circle cx="10" cy="10" r="10" fill="#F5ECE9"/>
        <text x="10" y="14" font-weight="800" font-size="10" fill="#874127" text-anchor="middle">4</text>
        <text x="28" y="10" font-weight="700" font-size="11" fill="#2A2421">Tự Tin &amp; Triển Lãm</text>
        <text x="28" y="22" font-size="9" fill="#888">Chia sẻ niềm vui sáng tạo</text>
      </g>
    </g>

    <!-- Handwritten teacher's note -->
    <g transform="translate(42, 270)">
      <text x="0" y="12" font-family="'Caveat', cursive" font-size="15" fill="#C85A32">"Mỗi nét cọ đều cần sự can đảm." — Mai Linh</text>
    </g>
  </g>

  <!-- Real Paintbrushes leaning across bottom right -->
  <g transform="translate(410, 420) rotate(-25)" filter="url(#artShdw)">
    <rect x="0" y="0" width="220" height="8" rx="4" fill="#5A3A1F"/>
    <rect x="180" y="-1" width="30" height="10" rx="2" fill="#D3D3D3"/>
    <path d="M210,0 Q235,4 210,8 Z" fill="#3B5A7A"/>
  </g>

  <!-- Tag Pill Overlay -->
  <g transform="translate(40, 40)">
    <rect width="215" height="34" rx="17" fill="#1F1F1F"/>
    <circle cx="20" cy="17" r="5" fill="#C85A32"/>
    <text x="36" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="12" fill="#FAF8F6">Giáo dục Mỹ thuật &amp; Xưởng vẽ</text>
  </g>
</svg>
