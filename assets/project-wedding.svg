<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgWedding" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF8F4"/>
      <stop offset="100%" stop-color="#F2EBE1"/>
    </linearGradient>
    <filter id="deskShdw" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#4B3B30" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="800" height="500" rx="24" fill="url(#bgWedding)"/>

  <!-- Botanical foliage branch line-art in background -->
  <g stroke="#C2B39E" stroke-width="1.5" fill="none" opacity="0.6">
    <path d="M50,120 Q180,60 220,180 T160,320"/>
    <ellipse cx="120" cy="80" rx="12" ry="6" transform="rotate(35 120 80)" fill="#EAE0D3"/>
    <ellipse cx="190" cy="110" rx="12" ry="6" transform="rotate(-25 190 110)" fill="#EAE0D3"/>
    <ellipse cx="200" cy="240" rx="12" ry="6" transform="rotate(40 200 240)" fill="#EAE0D3"/>
  </g>

  <!-- Laptop / Desktop Browser Mockup -->
  <g transform="translate(90, 50)" filter="url(#deskShdw)">
    <!-- Browser Chrome Frame -->
    <rect x="0" y="0" width="530" height="380" rx="16" fill="#FFFFFF" stroke="#E3DCD3" stroke-width="2"/>
    <rect x="0" y="0" width="530" height="38" rx="16" fill="#F7F3EE"/>
    <rect x="0" y="24" width="530" height="14" fill="#F7F3EE"/>
    
    <!-- Window buttons -->
    <circle cx="20" cy="19" r="5" fill="#E28670"/>
    <circle cx="36" cy="19" r="5" fill="#E5BD6F"/>
    <circle cx="52" cy="19" r="5" fill="#90B287"/>

    <!-- URL Bar -->
    <rect x="90" y="8" width="340" height="22" rx="11" fill="#FFFFFF" stroke="#E9E2D8" stroke-width="1"/>
    <text x="260" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#887F75" text-anchor="middle">www.minh-an-forever.vn</text>

    <!-- Browser Content: Wedding Landing Page -->
    <rect x="0" y="38" width="530" height="342" fill="#FAF7F2"/>
    
    <!-- Hero Banner Image Area with romantic Da Lat pine hills illustration -->
    <g transform="translate(30, 60)">
      <rect width="470" height="180" rx="12" fill="#EBE2D5"/>
      <!-- Misty Mountain Layer -->
      <path d="M0,140 Q120,60 240,110 T470,80 L470,180 L0,180 Z" fill="#D7C9B5" opacity="0.6"/>
      <path d="M0,110 Q160,40 320,90 T470,120 L470,180 L0,180 Z" fill="#C5B59E" opacity="0.4"/>
      <!-- Subtle silhouettes of couple holding hands under pine tree -->
      <g transform="translate(360, 70)" stroke="#685446" stroke-width="2" fill="none">
        <path d="M20,70 L20,30 L0,10 M20,20 L40,0 M20,40 L-10,35"/>
      </g>
      
      <!-- Calligraphic Wedding Title -->
      <text x="235" y="65" font-family="'Fraunces', serif" font-style="italic" font-weight="700" font-size="28" fill="#5A4335" text-anchor="middle">Minh &amp; An</text>
      <text x="235" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" letter-spacing="4" fill="#8C7464" text-anchor="middle">12 THÁNG 10, 2024 • ĐÀ LẠT, VIỆT NAM</text>
      <text x="235" y="112" font-family="'Caveat', cursive" font-size="16" fill="#C85A32" text-anchor="middle">"Hai tâm hồn, một chuyến phiêu lưu thơ mộng"</text>
      
      <!-- Interactive RSVP Button in web page -->
      <rect x="175" y="128" width="120" height="32" rx="16" fill="#8A5A44"/>
      <text x="235" y="148" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="10" fill="#FAF7F2" text-anchor="middle">Xác Nhận Tham Dự</text>
    </g>

    <!-- Lower Section: Itinerary Grid -->
    <g transform="translate(30, 260)">
      <rect x="0" y="0" width="145" height="95" rx="8" fill="#FFFFFF" stroke="#EAE2D8" stroke-width="1"/>
      <text x="14" y="24" font-family="'Fraunces', serif" font-weight="700" font-size="12" fill="#5A4335">Ngày 01 • Chào Đón</text>
      <text x="14" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#777">Tiệc Trà Rừng Thông</text>
      <text x="14" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#999">15:00 • Ana Mandara Da Lat</text>

      <rect x="162" y="0" width="145" height="95" rx="8" fill="#FFFFFF" stroke="#EAE2D8" stroke-width="1"/>
      <text x="176" y="24" font-family="'Fraunces', serif" font-weight="700" font-size="12" fill="#5A4335">Ngày 02 • Lễ Cưới</text>
      <text x="176" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#777">Hôn Lễ Hoàng Hôn &amp; Tiệc Tối</text>
      <text x="176" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#999">16:30 • Nhà Kính Rừng Thông</text>

      <rect x="324" y="0" width="145" height="95" rx="8" fill="#FFFFFF" stroke="#EAE2D8" stroke-width="1"/>
      <text x="338" y="24" font-family="'Fraunces', serif" font-weight="700" font-size="12" fill="#5A4335">Sổ Lưu Bút</text>
      <text x="338" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#777">190 Lời Chúc Gửi Về</text>
      <text x="338" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#C85A32">Gửi lời chúc →</text>
    </g>
  </g>

  <!-- Mobile Companion Screen (Right, Overlapping) -->
  <g transform="translate(580, 110) rotate(4)" filter="url(#deskShdw)">
    <rect x="0" y="0" width="140" height="280" rx="22" fill="#222" stroke="#444" stroke-width="2"/>
    <rect x="5" y="5" width="130" height="270" rx="18" fill="#FDFBF9"/>
    <!-- Mobile Notch -->
    <rect x="45" y="10" width="40" height="10" rx="5" fill="#222"/>
    <!-- Mobile RSVP Screen -->
    <text x="70" y="48" font-family="'Fraunces', serif" font-size="11" font-weight="700" fill="#5A4335" text-anchor="middle">Bạn sẽ tham dự chứ?</text>
    <rect x="15" y="65" width="100" height="24" rx="6" fill="#FFF" stroke="#DDD" stroke-width="1"/>
    <text x="24" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#AAA">Họ và tên...</text>
    
    <rect x="15" y="98" width="100" height="24" rx="6" fill="#FFF" stroke="#DDD" stroke-width="1"/>
    <text x="24" y="113" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#AAA">Tham dự? Có / Tiếc quá</text>

    <rect x="15" y="132" width="100" height="28" rx="14" fill="#C85A32"/>
    <text x="65" y="150" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="8.5" fill="#FFF" text-anchor="middle">Xác Nhận Tham Dự</text>

    <!-- Wax seal imprint -->
    <circle cx="65" cy="205" r="22" fill="#B3422A"/>
    <circle cx="65" cy="205" r="18" fill="none" stroke="#DCA28D" stroke-width="1"/>
    <text x="65" y="210" font-family="'Fraunces', serif" font-weight="700" font-size="12" fill="#FFF" text-anchor="middle">M &amp; A</text>
  </g>

  <!-- Tag Pill Overlay -->
  <g transform="translate(40, 40)">
    <rect width="200" height="34" rx="17" fill="#1F1F1F"/>
    <circle cx="20" cy="17" r="5" fill="#E28670"/>
    <text x="36" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="12" fill="#FAF8F6">Thiết kế Website &amp; Số</text>
  </g>
</svg>
